```yaml
name: CI Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT CODE
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4

      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================================================
      # CACHE PIP
      # =====================================================

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          pip install -r requirements.txt

      # =====================================================
      # INSTALL DVC
      # =====================================================

      - name: Install DVC
        run: |
          pip install "dvc[s3]"

      # =====================================================
      # VERIFY DVC INSTALLATION
      # =====================================================

      - name: Verify DVC
        run: |
          dvc version

      # =====================================================
      # CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =====================================================
      # RUN DVC PIPELINE
      # =====================================================

      - name: Run pipeline
        env:
          dagshubtoken: ${{ secrets.DAGSHUB_TOKEN }}
          dagshubusername: ${{ secrets.DAGSHUB_USERNAME }}

          # variables expected by your data_ingestion.py
          Accesskey: ${{ secrets.AWS_ACCESS_KEY_ID }}
          Secretkey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        run: |
          dvc repro

      # =====================================================
      # RUN MODEL TESTS
      # =====================================================

      - name: Run model tests
        env:
          dagshubtoken: ${{ secrets.DAGSHUB_TOKEN }}
          dagshubusername: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          python -m unittest tests/test_model.py

      # =====================================================
      # PROMOTE MODEL
      # =====================================================

      - name: Promote model to production
        if: success()
        env:
          dagshubtoken: ${{ secrets.DAGSHUB_TOKEN }}
          dagshubusername: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          python scripts/promote_model.py

      # =====================================================
      # RUN FLASK TESTS
      # =====================================================

      - name: Run Flask app tests
        if: success()
        env:
          dagshubtoken: ${{ secrets.DAGSHUB_TOKEN }}
          dagshubusername: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          python -m unittest tests/test_flask_app.py
```
